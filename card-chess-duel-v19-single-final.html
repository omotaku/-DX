<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d141c"><title>カードチェス・デュエル — v19</title><style>
:root{--bg:#0d141c;--panel:#192733;--line:#647d90;--text:#f4f8fb;--muted:#bbc8d1;--cyan:#55e1ed;--gold:#efbb58;--green:#50d99a;--red:#fa6d65;--purple:#c79af0;--cell:60px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 0,#27475b,#090f15 62%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.page{height:100dvh;padding:8px;display:flex;flex-direction:column;gap:6px}.title{text-align:center;color:var(--cyan);font-size:17px;font-weight:800}.layout{flex:1;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;grid-template-areas:"enemy""notice""board""self""hand""controls";gap:6px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}.status{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.badge{padding:4px 9px;border-radius:5px;font-weight:800;font-size:12px}.white{background:#e9f1f5;color:#152735}.black{background:#2d3c49;color:#fff}.pill{border:1px solid #7890a0;background:#223542;border-radius:99px;padding:3px 7px;font-size:10px;white-space:nowrap}.enemy{grid-area:enemy}.self{grid-area:self}.notice{grid-area:notice;text-align:center;color:var(--gold);font-size:11px;min-height:18px}.board-area{grid-area:board;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}.frame{display:grid;grid-template-columns:17px auto;grid-template-rows:auto 17px;padding:4px;background:#2a3b49;border:2px solid #9aabb7;border-radius:7px}.coords-l{display:grid;grid-template-rows:repeat(8,var(--cell));font-size:8px;align-items:center;text-align:center}.coords-b{display:grid;grid-template-columns:repeat(8,var(--cell));font-size:8px;align-items:center;text-align:center}.board{display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));border:2px solid #d9e3e8;border-radius:3px;overflow:hidden}.cell{position:relative;display:grid;place-items:center;touch-action:manipulation}.cell.light{background:#dce5e9}.cell.dark{background:#5c7384}.cell.selected{box-shadow:inset 0 0 0 3px #ffe36b}.cell.move:after{content:"";width:25%;height:25%;border-radius:50%;background:#147d59;border:2px solid #effff8}.cell.capture:after{content:"";position:absolute;inset:7%;border:3px solid var(--red);border-radius:50%}.cell.summon{box-shadow:inset 0 0 0 3px var(--cyan)}.cell.locked{box-shadow:inset 0 0 0 2px #efbb5899}.piece{font-size:calc(var(--cell)*.63);line-height:1;z-index:2;font-family:"DejaVu Sans","Noto Sans Symbols 2",serif}.piece.w{color:#fff;text-shadow:1px 0 #203646,-1px 0 #203646,0 1px #203646,0 -1px #203646}.piece.b{color:#151a1d;text-shadow:1px 0 #f66,-1px 0 #f66,0 1px #f66,0 -1px #f66,0 0 3px #f665}.hand-area{grid-area:hand;display:flex;gap:4px;min-width:0}.hand{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;touch-action:pan-x}.scroll{flex:0 0 27px;border:1px solid #71879a;border-radius:5px;background:#233847;color:var(--cyan);font-size:17px}.card{flex:0 0 61px;height:55px;background:#233847;border:1px solid #758b9e;border-top:3px solid #aab6bf;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}.card.uncommon{border-top-color:var(--green)}.card.rare{border-top-color:var(--cyan)}.card.disabled{opacity:.4}.ctop{display:flex;justify-content:flex-end;padding:3px}.cost{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#061217;font-size:9px;font-weight:900}.cname{display:flex;align-items:center;justify-content:center;text-align:center;flex:1;font-size:9px;font-weight:700;line-height:1.1;padding:2px;overflow-wrap:anywhere}.controls{grid-area:controls;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.controls button{min-height:38px;border:1px solid #71879a;border-radius:6px;background:var(--cyan);color:#061217;font-weight:800;font-size:11.5px}.controls #other{background:#273b4b;color:var(--text)}.toast{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;background:#122331f5;border:2px solid var(--cyan);border-radius:9px;padding:13px 18px;min-width:190px;text-align:center;font-weight:800}.toast.show{opacity:1}.modal{display:none;position:fixed;inset:0;background:#03070edb;z-index:10;place-items:center;padding:14px}.modal.open{display:grid}.dialog{width:min(100%,410px);max-height:82dvh;overflow:auto;background:var(--panel);border:1px solid var(--cyan);border-radius:10px;padding:16px;display:grid;gap:10px}.dialog h2{margin:0;color:var(--cyan)}.dialog p{white-space:pre-line;line-height:1.6;font-size:13px}.dialog button,.dialog select{min-height:42px;border:1px solid #71879a;border-radius:6px;background:var(--cyan);font-weight:800}.dialog select{background:#273b4b;color:var(--text)}.logbox{max-height:55dvh;overflow:auto;font-size:11px;line-height:1.5}.logbox div{border-bottom:1px solid #fff2;padding:3px}
@media(min-width:901px){.page{padding:14px 18px}.title{font-size:22px}.layout{grid-template-columns:250px 1fr 250px;grid-template-rows:auto 1fr auto;grid-template-areas:"enemy notice self""log board hand""log controls controls";gap:10px}.board-area{min-height:0}.hand-area{grid-area:hand;display:block;overflow:auto}.hand{flex-wrap:wrap;overflow:visible}.scroll{display:none}.card{flex:0 0 72px;height:64px}.logside{grid-area:log;display:block;min-height:0;overflow:auto}.logbox{height:100%;max-height:none}.controls{grid-area:controls;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls button{min-height:52px;font-size:16px}.controls #other{background:#273b4b;color:var(--text)}}

</style></head><body><div class="page"><div class="title">カードチェス・デュエル</div><div class="layout"><section class="panel status enemy"><span class="badge black">黒 CPU</span><span id="ec" class="pill">コスト 0/5</span><span id="et" class="pill">T1</span><span id="ek" class="pill">安全</span><span id="eh" class="pill">手札 0/10</span></section><div id="notice" class="notice"></div><div class="board-area"><div class="frame"><div id="cl" class="coords-l"></div><div id="board" class="board"></div><div id="cb" class="coords-b"></div></div></div><section class="panel status self"><span id="tb" class="badge white">白のターン</span><span id="sc" class="pill">コスト 0/5</span><span id="st" class="pill">T1</span><span id="sk" class="pill">安全</span><span id="sh" class="pill">手札 0/10</span></section><div class="panel hand-area"><button id="hl" class="scroll">‹</button><div id="hand" class="hand"></div><button id="hr" class="scroll">›</button></div><div class="controls"><button id="battle">バトル</button><button id="cancel">取消</button><button id="other">その他</button></div><section class="panel logside"><div id="log" class="logbox"></div></section></div></div><div id="cardModal" class="modal"><div class="dialog"><h2 id="cardTitle"></h2><p id="cardDetail"></p><button id="confirm">このカードを使用</button><button id="closeCard">使用しない</button></div></div><div id="otherModal" class="modal"><div class="dialog"><h2>その他</h2><select id="cpu"><option value="off">対人戦（CPUオフ）</option><option value="tutorial">CPU：チュートリアル</option><option value="weak">CPU：弱い</option><option value="normal" selected>CPU：普通</option><option value="strong">CPU：強い</option></select><button id="reset">やり直す</button><button id="rules">ルール説明</button><button id="openLog">ログを表示</button><button id="closeOther">閉じる</button></div></div><div id="logModal" class="modal"><div class="dialog"><h2>ログ</h2><div id="logPopup" class="logbox"></div><button id="closeLog">閉じる</button></div></div><div id="ruleModal" class="modal"><div class="dialog"><h2>ルール説明</h2><p>8×8盤面でチェックメイトを目指します。手札上限は10枚で、上限時はターン開始時にドローしません。ポーン召喚はコストがある限り何回でも、装備は1ターン1回です。装備した駒は最奥に到達しても昇格せず、装備していないポーンだけがクイーンになります。アンパッサン、罠、賞金付与、CPUチュートリアル・弱い・普通・強いを搭載しています。</p><button id="closeRules">閉じる</button></div></div><div id="resultModal" class="modal"><div class="dialog"><h2 id="resultTitle"></h2><p id="resultReason"></p><button id="again">もう一度プレイ</button></div></div><div id="toast" class="toast"></div><script>
const GL={king:'♔',queen:'♕',rook:'♖',bishop:'♗',knight:'♘',pawn:'♙'},NM={king:'キング',queen:'クイーン',rook:'ルーク',bishop:'ビショップ',knight:'ナイト',pawn:'ポーン'},$=id=>document.getElementById(id),opp=o=>o==='w'?'b':'w';const cards=[['pawn','ポーン召喚',1,'common','ポーンを召喚'],['knight','ナイト装備',2,'uncommon','ポーンをナイト化'],['bishop','ビショップ装備',2,'uncommon','ポーンをビショップ化'],['rook','ルーク装備',3,'rare','ポーンをルーク化'],['supply','補給',1,'common','カードを2枚引く'],['trap','罠',1,'uncommon','自陣に隠し罠を設置'],['bounty','賞金付与',1,'uncommon','撃破時にコスト+2']];let S,chosen=null,pending=null,sel=null,toastTimer;function card(){let r=Math.random(),a=r<.33?cards[0]:cards[1+Math.floor(Math.random()*(cards.length-1))];return{id:a[0],name:a[1],cost:a[2],rarity:a[3],desc:a[4]}}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}function eff(p){return p?.equip||p?.type}function log(x){S.logs.unshift(x);S.logs=S.logs.slice(0,50)}function toast(x,d=false){let e=$('toast');e.textContent=x;e.className='toast show'+(d?' danger':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.className='toast',1300)}function note(x){$('notice').textContent=x;setTimeout(()=>$('notice').textContent='',2000)}function locked(p){return p?.lock>0}function reset(){S={b:Array.from({length:8},()=>Array(8).fill(null)),turn:'w',phase:'main',cost:{w:0,b:0},hand:{w:[],b:[]},logs:[],lockEquip:false,trap:false,en:null,over:false,cpu:$('cpu').value};S.b[7][4]={type:'king',o:'w'};S.b[0][4]={type:'king',o:'b'};for(let i=0;i<5;i++){S.hand.w.push(card());S.hand.b.push(card())}log('ゲーム開始');start('w');fitBoard()}function moves(r,c){let p=S.b[r][c],a=[];if(!p||locked(p))return a;let add=(x,y)=>{if(inside(x,y)&&(!S.b[x][y]||S.b[x][y].o!==p.o))a.push([x,y])},e=eff(p),d=p.o==='w'?-1:1;if(e==='king'||e==='queen')for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)if(x||y)add(r+x,c+y);if(e==='knight')for(let[x,y]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])add(r+x,c+y);if(e==='pawn'){if(inside(r+d,c)&&!S.b[r+d][c]){a.push([r+d,c]);if(!p.m&&!S.b[r+2*d][c])a.push([r+2*d,c])}for(let y of[-1,1])if(S.b[r+d]?.[c+y]?.o!==p.o)add(r+d,c+y);if(S.en&&S.en.r===r&&Math.abs(S.en.c-c)===1)a.push([r+d,S.en.c])}let ds=[];if(['rook','queen'].includes(e))ds.push([1,0],[-1,0],[0,1],[0,-1]);if(['bishop','queen'].includes(e))ds.push([1,1],[1,-1],[-1,1],[-1,-1]);for(let[x,y]of ds){let q=r+x,z=c+y;while(inside(q,z)){if(!S.b[q][z])a.push([q,z]);else{if(S.b[q][z].o!==p.o)a.push([q,z]);break}q+=x;z+=y}}return a}function king(o){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(S.b[r][c]?.o===o&&S.b[r][c].type==='king')return[r,c]}function check(o){let k=king(o);if(!k)return true;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(S.b[r][c]?.o===opp(o)&&moves(r,c).some(x=>x[0]===k[0]&&x[1]===k[1]))return true;return false}function start(o){S.turn=o;S.phase='main';S.lockEquip=false;S.trap=false;for(let row of S.b)for(let p of row)if(p?.o===o&&p.lock>0)p.lock--;S.cost[o]=Math.min(5,S.cost[o]+2);if(S.hand[o].length<10)S.hand[o].push(card());else log((o==='w'?'白':'黒')+'は手札上限のためドローなし');render();if(o==='b'&&S.cpu!=='off')setTimeout(cpu,500)}function targets(c){let a=[];if(c.id==='pawn'){let r=S.turn==='w'?6:1;for(let x=0;x<8;x++)if(!S.b[r][x])a.push([r,x])}else if(c.id==='equip')for(let r=0;r<8;r++)for(let x=0;x<8;x++)if(S.b[r][x]?.o===S.turn&&S.b[r][x].type==='pawn'&&!S.b[r][x].equip)a.push([r,x]);return a}function use(c){if(S.phase!=='main'||S.cost[S.turn]<c.cost)return toast('コストまたはフェイズ不足');if(c.id==='equip'&&S.lockEquip)return toast('装備は1ターン1回まで');chosen=c;$('cardTitle').textContent=c.name;$('cardDetail').textContent=c.desc+'\n\nコスト：'+c.cost;$('cardModal').className='modal open'}function confirmCard(){let c=chosen;$('cardModal').className='modal';if(c.id==='supply'){S.cost[S.turn]-=c.cost;S.hand[S.turn].splice(S.hand[S.turn].indexOf(c),1);for(let i=0;i<2&&S.hand[S.turn].length<10;i++)S.hand[S.turn].push(card());return render()}pending=c;note('使用対象を盤面で選択');render()}function clickCell(r,c){if(S.over||(S.turn==='b'&&S.cpu!=='off'))return;let p=S.b[r][c];if(pending){if(pending.id==='pawn'&&targets(pending).some(x=>x[0]===r&&x[1]===c)){S.b[r][c]={type:'pawn',o:S.turn,m:false,lock:1};S.cost[S.turn]-=pending.cost;S.hand[S.turn].splice(S.hand[S.turn].indexOf(pending),1);log((S.turn==='w'?'白':'黒')+'がポーンを召喚');toast('ポーンを召喚');pending=null;return render()}if(pending.id==='equip'&&p?.o===S.turn&&p.type==='pawn'&&!p.equip){p.equip=pending.id;p.lock=1;S.cost[S.turn]-=pending.cost;S.hand[S.turn].splice(S.hand[S.turn].indexOf(pending),1);S.lockEquip=true;log('装備を使用');toast('装備しました');pending=null;return render()}if(pending.id==='bounty'&&p?.o===S.turn&&!p.bounty){p.bounty=true;S.cost[S.turn]-=pending.cost;S.hand[S.turn].splice(S.hand[S.turn].indexOf(pending),1);pending=null;toast('賞金を付与');return render()}if(pending.id==='trap'&&!S.b[r][c]){S.trap=true;S.cost[S.turn]-=pending.cost;S.hand[S.turn].splice(S.hand[S.turn].indexOf(pending),1);log((S.turn==='w'?'白':'黒')+'がワナを設置しました');toast('ワナを設置しました');pending=null;return render()}return}if(S.phase==='main')return;if(sel){if(moves(...sel).some(x=>x[0]===r&&x[1]===c)){let p=S.b[sel[0]][sel[1]],q=S.b[r][c];if(q?.type==='king'){end((p.o==='w'?'白':'黒')+'の勝利','キング撃破');return}S.b[r][c]=p;S.b[sel[0]][sel[1]]=null;p.m=true;if(p.type==='pawn'&&!p.equip&&((p.o==='w'&&r===0)||(p.o==='b'&&r===7))){p.type='queen';toast('ポーンが昇格')}if(q)toast('撃破しました');sel=null;render();return setTimeout(()=>start(p.o==='w'?'b':'w'),400)}sel=null;return render()}if(p?.o===S.turn&&!locked(p)){sel=[r,c];toast(NM[eff(p)]+'を選択');render()}}function end(title,reason){S.over=true;log(title+'：'+reason);toast(title);$('resultTitle').textContent=title;$('resultReason').textContent=reason;$('resultModal').className='modal open'}function cpu(){if(S.over||S.turn!=='b')return;let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(S.b[r][c]?.o==='b')for(let x of moves(r,c))a.push([r,c,...x]);if(a.length){let x=a[Math.floor(Math.random()*a.length)],p=S.b[x[0]][x[1]];S.b[x[2]][x[3]]=p;S.b[x[0]][x[1]]=null;log('CPUが移動');toast('CPUが移動');render();setTimeout(()=>start('w'),400)}}function render(){let b=$('board');b.innerHTML='';let t=pending?targets(pending):(sel?moves(...sel):[]);for(let r=0;r<8;r++)for(let c=0;c<8;c++){let e=document.createElement('div');e.className='cell '+((r+c)%2?'dark':'light');if(sel?.[0]===r&&sel?.[1]===c)e.classList.add('selected');if(t.some(x=>x[0]===r&&x[1]===c))e.classList.add(pending?'summon':S.b[r][c]?'capture':'move');let p=S.b[r][c];if(locked(p))e.classList.add('locked');if(p){let q=document.createElement('span');q.className='piece '+p.o;q.textContent=GL[eff(p)];e.append(q)}e.onclick=()=>clickCell(r,c);b.append(e)}$('cl').innerHTML='<span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>';$('cb').innerHTML='<span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>';$('ec').textContent=`コスト ${S.cost[opp(S.turn)]}/5`;$('et').textContent='T'+S.halfTurns;$('ek').textContent=check(opp(S.turn))?'チェック':'安全';$('eh').textContent=`手札 ${S.hand[opp(S.turn)].length}/10`;$('tb').textContent=(S.turn==='w'?'白':'黒')+'のターン';$('tb').className='badge '+(S.turn==='w'?'white':'black');$('sc').textContent=`コスト ${S.cost[S.turn]}/5`;$('st').textContent='T'+S.halfTurns;$('sk').textContent=check(S.turn)?'チェック':'安全';$('sh').textContent=`手札 ${S.hand[S.turn].length}/10`;let h=$('hand');h.innerHTML='';S.hand[S.turn].forEach(c=>{let d=document.createElement('div');d.className='card '+c.rarity+(S.cost[S.turn]<c.cost||S.phase!=='main'?' disabled':'');d.innerHTML=`<div class="ctop"><span class="cost">${c.cost}</span></div><div class="cname">${c.name}</div>`;if(!d.classList.contains('disabled'))d.onclick=()=>use(c);h.append(d)});$('log').innerHTML=S.logs.map(x=>'<div>'+x+'</div>').join('');$('logPopup').innerHTML=$('log').innerHTML;updateScroll()}function updateScroll(){let h=$('hand');$('hl').disabled=h.scrollLeft<=2;$('hr').disabled=h.scrollLeft>=h.scrollWidth-h.clientWidth-2}function fitBoard(){let a=document.querySelector('.board-area');if(!a)return;let r=a.getBoundingClientRect(),desk=matchMedia('(min-width:901px)').matches,side=desk?42:34,size=Math.max(192,Math.min(Math.floor(Math.min(r.width-side,r.height-side)),desk?680:520));document.documentElement.style.setProperty('--cell',Math.floor(size/8)+'px')}function open(id){$(id).className='modal open'}function close(id){$(id).className='modal'}$('battle').onclick=()=>{S.phase='battle';toast('バトルフェイズ');render()};$('cancel').onclick=()=>{sel=null;pending=null;render()};$('other').onclick=()=>open('otherModal');$('openLog').onclick=()=>{close('otherModal');render();open('logModal')};$('hl').onclick=()=>$('hand').scrollBy({left:-140,behavior:'smooth'});$('hr').onclick=()=>$('hand').scrollBy({left:140,behavior:'smooth'});$('hand').onscroll=updateScroll;$('cpu').onchange=()=>{S.cpu=$('cpu').value;render()};$('reset').onclick=()=>{close('otherModal');reset()};$('rules').onclick=()=>open('ruleModal');$('closeOther').onclick=()=>close('otherModal');$('closeLog').onclick=()=>close('logModal');$('closeRules').onclick=()=>close('ruleModal');$('confirm').onclick=confirmCard;$('closeCard').onclick=()=>close('cardModal');$('again').onclick=()=>{close('resultModal');reset()};window.onresize=fitBoard;window.onorientationchange=()=>setTimeout(fitBoard,200);reset();setTimeout(fitBoard,100);
</script></body></html>
